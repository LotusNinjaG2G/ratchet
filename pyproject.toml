[project]
name = "ratchet-harness"
version = "0.1.0"
description = "A parallel agent-orchestration harness with a durable knowledge ratchet that carries confirmed results AND reusable strategies forward."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Jennifer Schieferle Uhlenbrock" }]
keywords = [
    "ai-agents",
    "agentic-ai",
    "orchestration",
    "llm",
    "ai-security",
    "automation",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/LotusNinjaG2G/ratchet"
Origin = "https://github.com/LotusNinjaG2G/huntress-ctf-2026-writeups"
Companion = "https://github.com/LotusNinjaG2G/agent-guardrails"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["ratchet"]
